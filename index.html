  <style>
    :root {
      --bg: #000000;
      --card-bg: rgba(28, 28, 30, 0.88);
      --btn-num: #2c2c2e;
      --btn-sci: #1c1c1e;
      --btn-top: #3a3a3c;
      --btn-del: #ff3b30;
      --btn-ac: #34c759;
      --btn-shift: #ff9f0a;
      --btn-alpha: #ff2d55;
      --text: #ffffff;
      --border: rgba(255, 255, 255, 0.12);
      
      --color-red: #ff3b30;
      --color-orange: #ff9500;
      --color-yellow: #ffcc00;
      --color-green: #34c759;
      --color-blue: #007aff;
      --color-purple: #af52de;
      --color-pink: #ff2d55;
      --accent: var(--color-blue);
    }

    [data-theme="light"] {
      --bg: #f2f2f7;
      --card-bg: rgba(255, 255, 255, 0.88);
      --btn-num: #ffffff;
      --btn-sci: #e5e5ea;
      --btn-top: #d1d1d6;
      --text: #000000;
      --border: rgba(0, 0, 0, 0.12);
    }

    [data-color="red"] { --accent: var(--color-red); }
    [data-color="orange"] { --accent: var(--color-orange); }
    [data-color="yellow"] { --accent: var(--color-yellow); }
    [data-color="green"] { --accent: var(--color-green); }
    [data-color="blue"] { --accent: var(--color-blue); }
    [data-color="purple"] { --accent: var(--color-purple); }
    [data-color="pink"] { --accent: var(--color-pink); }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; justify-content: center; width: 100%; max-width: 370px; }
    button.tool-btn { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); padding: 6px 12px; border-radius: 12px; font-size: 12px; font-weight: 500; cursor: pointer; backdrop-filter: blur(10px); flex: 1; }
    
    .calc-card { 
      background: var(--card-bg); 
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border); 
      border-radius: 32px; 
      padding: 18px; 
      width: 100%; 
      max-width: 370px; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      position: relative;
    }

    /* Unfolding Panels */
    .panel {
      display: none;
      background: rgba(18, 18, 20, 0.95);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      margin-bottom: 12px;
      max-height: 280px;
      overflow-y: auto;
      font-size: 12px;
    }
    .panel.open { display: block; }
    .panel h4 { margin-bottom: 8px; font-weight: 600; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    
    .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .setting-row select { background: var(--btn-top); color: var(--text); border: 1px solid var(--border); padding: 4px 8px; border-radius: 8px; }

    .palette { display: flex; gap: 6px; }
    .dot { width: 16px; height: 16px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }
    .dot.red { background: var(--color-red); }
    .dot.orange { background: var(--color-orange); }
    .dot.yellow { background: var(--color-yellow); }
    .dot.green { background: var(--color-green); }
    .dot.blue { background: var(--color-blue); }
    .dot.purple { background: var(--color-purple); }
    .dot.pink { background: var(--color-pink); }

    .instruction-item { margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 4px; }
    .instruction-item strong { color: var(--btn-shift); }

    .status-bar { display: flex; justify-content: space-between; font-size: 10px; opacity: 0.6; padding: 0 4px 6px 4px; font-weight: 600; letter-spacing: 0.5px; }
    
    .display { width: 100%; padding: 12px; text-align: right; margin-bottom: 14px; background: rgba(0,0,0,0.18); border-radius: 18px; border: 1px solid var(--border); }
    .expression { font-size: 12px; opacity: 0.5; min-height: 16px; word-break: break-all; }
    .current { font-size: 28px; font-weight: 300; letter-spacing: -0.5px; word-break: break-all; min-height: 36px; }

    .section-title { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; opacity: 0.4; margin: 8px 0 4px 2px; }

    .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }

    button { 
      background: var(--btn-sci); 
      color: var(--text); 
      border: none; 
      height: 36px; 
      border-radius: 10px; 
      font-size: 12px; 
      font-weight: 500; 
      cursor: pointer;
      transition: opacity 0.12s ease, transform 0.08s ease;
    }
    button:active { opacity: 0.6; transform: scale(0.95); }
    
    .btn-shift { background: var(--btn-shift); color: #fff; font-weight: bold; font-size: 10px; }
    .btn-alpha { background: var(--btn-alpha); color: #fff; font-weight: bold; font-size: 10px; }
    .btn-top { background: var(--btn-top); font-size: 10px; }
    .btn-num { background: var(--btn-num); font-size: 15px; }
    .btn-del { background: var(--btn-del); color: #fff; font-weight: bold; }
    .btn-ac { background: var(--btn-ac); color: #fff; font-weight: bold; }
    .btn-op { background: var(--accent); color: #fff; font-size: 16px; }
  </style>
</head>

      <button onclick="insertFunc('^')">xⁿ</button>

    </div>

          { btn: "DEL", key: "Backspace", desc: "پاک کردن آخرین کاراکتر." },
          { btn: "AC / ON", key: "Escape", desc: "پاک کردن کامل صفحه." },
          { btn: "SHIFT", key: "Shift", desc: "فعال‌سازی توابع معکوس (asin, acos, atan)." },
          { btn: "sin, cos, tan", key: "s, c, t", desc: "توابع مثلثاتی." },
          { btn: "√, x², xⁿ", key: "r, q, ^", desc: "جذر (r)، توان دو (q) و توان دلخواه (^)." },
          { btn: "log, ln", key: "l, n", desc: "لگاریتم مبنای ۱۰ (l) و طبیعی (n)." },
          { btn: "(, )", key: "(, )", desc: "پرانتز باز و بسته." },
          { btn: "π, e", key: "p, e", desc: "وارد کردن ثابتهای پی و اویلر." },
          { btn: "Ans", key: "a", desc: "فراخوانی آخرین پاسخ." },
          { btn: "MODE", key: "m", desc: "تغییر حالت بین درجه (DEG) و رادیان (RAD)." }
        ]
      }
    };

    function changeLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];
      document.getElementById('lblSettings').innerText = t.settings;
      document.getElementById('lblInstructions').innerText = t.help;
      document.getElementById('hdrSettings').innerText = t.settings;
      document.getElementById('lblLanguage').innerText = t.language;
      document.getElementById('lblTheme').innerText = t.theme;
      document.getElementById('lblAccent').innerText = t.accent;
      document.getElementById('hdrInstructions').innerText = t.hdrInstructions;
      document.getElementById('secSys').innerText = t.sysTitle;
      document.getElementById('secSci').innerText = t.sciTitle;
      document.getElementById('secNum').innerText = t.numTitle;

      let html = "";
      t.instructions.forEach(item => {
        html += `<div class="instruction-item">
          <strong>${item.btn}</strong> [Key: <code>${item.key}</code>]: ${item.desc}
        </div>`;
      });
      document.getElementById('instructionsContent').innerHTML = html;
    }

    function togglePanel(panelId) {
      const p = document.getElementById(panelId);
      const isOpen = p.classList.contains('open');
      document.querySelectorAll('.panel').forEach(el => el.classList.remove('open'));
      if (!isOpen) p.classList.add('open');
    }

    function toggleTheme() {
      const html = document.documentElement;
      html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }

    function setColor(color) {
      document.documentElement.setAttribute('data-color', color);
    }

    function toggleShift() {
      isShift = !isShift;
      document.getElementById('shiftIndicator').innerText = isShift ? "SHIFT" : "DIRECT";
      document.getElementById('btnSin').innerText = isShift ? "asin" : "sin";
      document.getElementById('btnCos').innerText = isShift ? "acos" : "cos";
      document.getElementById('btnTan').innerText = isShift ? "atan" : "tan";
    }

    function toggleAlpha() {}

    function toggleDeg() {
      isDeg = !isDeg;
      document.getElementById('degRad').innerText = isDeg ? "DEG" : "RAD";
    }

    function updateDisplay() {
      document.getElementById('displayText').innerText = expr === "" ? "0" : expr;
    }

    function insertNum(num) {
      expr += num;
      updateDisplay();
    }

    function insertOp(op) {
      expr += op;
      updateDisplay();
    }

    function insertFunc(fn) {
      if (fn === 'sin(' && isShift) fn = 'asin(';
      if (fn === 'cos(' && isShift) fn = 'acos(';
      if (fn === 'tan(' && isShift) fn = 'atan(';

      if (fn === 'RCL') { expr += memoryVal.toString(); updateDisplay(); return; }
      if (fn === 'M+') { memoryVal += parseFloat(expr) || 0; return; }
      if (fn === 'Ans') { expr += lastAns.toString(); updateDisplay(); return; }

      expr += fn;
      if (isShift) toggleShift();
      updateDisplay();
    }

    function toggleSign() {
      if (expr.startsWith('-')) expr = expr.slice(1);
      else expr = '-' + expr;
      updateDisplay();
    }

    function clearAll() {
      expr = "";
      document.getElementById('exprText').innerText = "";
      updateDisplay();
    }

    function deleteChar() {
      expr = expr.slice(0, -1);
      updateDisplay();
    }

    function evaluateDirect() {
      if (!expr) return;
      document.getElementById('exprText').innerText = expr;

      try {
        let parseExpr = expr
          .replace(/π/g, Math.PI)
          .replace(/e/g, Math.E)
          .replace(/Abs\(/g, 'Math.abs(')
          .replace(/√\(/g, 'Math.sqrt(')
          .replace(/log\(/g, 'Math.log10(')
          .replace(/ln\(/g, 'Math.log(')
          .replace(/\^/g, '**');

        if (isDeg) {
          parseExpr = parseExpr
            .replace(/sin\(([^)]+)\)/g, (m, p) => `Math.sin((${p}) * Math.PI / 180)`)
            .replace(/cos\(([^)]+)\)/g, (m, p) => `Math.cos((${p}) * Math.PI / 180)`)
            .replace(/tan\(([^)]+)\)/g, (m, p) => `Math.tan((${p}) * Math.PI / 180)`)
            .replace(/asin\(([^)]+)\)/g, (m, p) => `(Math.asin(${p}) * 180 / Math.PI)`)
            .replace(/acos\(([^)]+)\)/g, (m, p) => `(Math.acos(${p}) * 180 / Math.PI)`)
            .replace(/atan\(([^)]+)\)/g, (m, p) => `(Math.atan(${p}) * 180 / Math.PI)`);
        } else {
          parseExpr = parseExpr
            .replace(/sin\(/g, 'Math.sin(')
            .replace(/cos\(/g, 'Math.cos(')
            .replace(/tan\(/g, 'Math.tan(')
            .replace(/asin\(/g, 'Math.asin(')
            .replace(/acos\(/g, 'Math.acos(')
            .replace(/atan\(/g, 'Math.atan(');
        }

        let result = Function('"use strict"; return (' + parseExpr + ')')();
        lastAns = result;
        expr = result.toString();
        updateDisplay();
      } catch (err) {
        document.getElementById('displayText').innerText = "Error";
        expr = "";
      }
    }

    // Full Keyboard Listener Mapping
    window.addEventListener('keydown', function(e) {
      if (e.key >= '0' && e.key <= '9') insertNum(e.key);
      else if (e.key === '.') insertNum('.');
      else if (e.key === '+') insertOp('+');
      else if (e.key === '-') insertOp('-');
      else if (e.key === '*') insertOp('*');
      else if (e.key === '/') { e.preventDefault(); insertOp('/'); }
      else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); evaluateDirect(); }
      else if (e.key === 'Backspace') { e.preventDefault(); deleteChar(); }
      else if (e.key === 'Escape') clearAll();
      else if (e.key === '(') insertFunc('(');
      else if (e.key === ')') insertFunc(')');
      else if (e.key === '^') insertFunc('^');
      else if (e.key === 's') insertFunc('sin(');
      else if (e.key === 'c') insertFunc('cos(');
      else if (e.key === 't') insertFunc('tan(');
      else if (e.key === 'l') insertFunc('log(');
      else if (e.key === 'n') insertFunc('ln(');
      else if (e.key === 'r') insertFunc('√(');
      else if (e.key === 'q') insertFunc('^2');
      else if (e.key === 'p') insertFunc('π');
      else if (e.key === 'e') insertFunc('e');
      else if (e.key === 'a') insertFunc('Ans');
      else if (e.key === 'm') toggleDeg();
      else if (e.key === 'Shift') toggleShift();
    });

    // Initialize English Language & Instructions Panel
    changeLanguage('en');
  </script>
</body>
</html>
