<!DOCTYPE html>
<html lang="en" data-theme="dark" data-color="blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fx-82 AU iOS Style (Direct Logic)</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: rgba(28, 28, 30, 0.85);
      --btn-num: #2c2c2e;
      --btn-func: #3a3a3c;
      --btn-shift: #ff9f0a;
      --text: #ffffff;
      --border: rgba(255, 255, 255, 0.12);
      
      --color-red: #ff3b30;
      --color-orange: #ff9500;
      --color-yellow: #ffcc00;
      --color-green: #34c759;
      --color-blue: #007aff;
      --color-purple: #af52de;
      --color-pink: #ff2d55;
      --accent: var(--color-blue);
    }

    [data-theme="light"] {
      --bg: #f2f2f7;
      --card-bg: rgba(255, 255, 255, 0.85);
      --btn-num: #ffffff;
      --btn-func: #e5e5ea;
      --text: #000000;
      --border: rgba(0, 0, 0, 0.12);
    }

    [data-color="red"] { --accent: var(--color-red); }
    [data-color="orange"] { --accent: var(--color-orange); }
    [data-color="yellow"] { --accent: var(--color-yellow); }
    [data-color="green"] { --accent: var(--color-green); }
    [data-color="blue"] { --accent: var(--color-blue); }
    [data-color="purple"] { --accent: var(--color-purple); }
    [data-color="pink"] { --accent: var(--color-pink); }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
    select, button.tool-btn { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); padding: 4px 8px; border-radius: 12px; font-size: 11px; cursor: pointer; backdrop-filter: blur(10px); }
    
    .palette { display: flex; gap: 4px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }
    .dot.red { background: var(--color-red); }
    .dot.orange { background: var(--color-orange); }
    .dot.yellow { background: var(--color-yellow); }
    .dot.green { background: var(--color-green); }
    .dot.blue { background: var(--color-blue); }
    .dot.purple { background: var(--color-purple); }
    .dot.pink { background: var(--color-pink); }

    .calc-card { 
      background: var(--card-bg); 
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border); 
      border-radius: 32px; 
      padding: 16px; 
      width: 100%; 
      max-width: 360px; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .status-bar { display: flex; justify-content: space-between; font-size: 10px; opacity: 0.6; padding: 0 4px 4px 4px; font-weight: 600; letter-spacing: 0.5px; }
    
    .display { width: 100%; padding: 12px; text-align: right; margin-bottom: 8px; background: rgba(0,0,0,0.15); border-radius: 16px; border: 1px solid var(--border); }
    .expression { font-size: 13px; opacity: 0.6; min-height: 18px; word-break: break-all; }
    .current { font-size: 32px; font-weight: 300; letter-spacing: -0.5px; word-break: break-all; min-height: 38px; }

    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }

    .grid button { 
      background: var(--btn-num); 
      color: var(--text); 
      border: none; 
      height: 42px; 
      border-radius: 12px; 
      font-size: 13px; 
      font-weight: 500; 
      cursor: pointer;
      transition: opacity 0.12s ease, transform 0.08s ease;
    }
    .grid button:active { opacity: 0.6; transform: scale(0.95); }
    
    .grid button.func { background: var(--btn-func); font-size: 11px; }
    .grid button.shift-btn { background: var(--btn-shift); color: #ffffff; font-weight: bold; }
    .grid button.op { background: var(--accent); color: #ffffff; font-size: 16px; font-weight: 600; }
    .grid button.del { background: var(--color-red); color: #ffffff; }
  </style>
</head>
<body>

  <div class="toolbar">
    <button class="tool-btn" onclick="toggleTheme()">☀️ / 🌙</button>
    <div class="palette">
      <div class="dot red" onclick="setColor('red')"></div>
      <div class="dot orange" onclick="setColor('orange')"></div>
      <div class="dot yellow" onclick="setColor('yellow')"></div>
      <div class="dot green" onclick="setColor('green')"></div>
      <div class="dot blue" onclick="setColor('blue')"></div>
      <div class="dot purple" onclick="setColor('purple')"></div>
      <div class="dot pink" onclick="setColor('pink')"></div>
    </div>
  </div>

  <div class="calc-card">
    <div class="status-bar">
      <span id="shiftIndicator">DIRECT LOGIC</span>
      <span>fx-82AU iOS</span>
      <span id="degRad">DEG</span>
    </div>

    <div class="display">
      <div class="expression" id="exprText"></div>
      <div class="current" id="displayText">0</div>
    </div>
    
    <div class="grid">
      <!-- Row 1 -->
      <button class="shift-btn" onclick="toggleShift()" id="shiftBtn">SHIFT</button>
      <button class="func" onclick="insertFunc('(')">(</button>
      <button class="func" onclick="insertFunc(')')">)</button>
      <button class="func" onclick="insertFunc('^2')">x²</button>
      <button class="func" onclick="insertFunc('^')">xⁿ</button>

      <!-- Row 2 -->
      <button class="func" onclick="insertFunc('log(')">log</button>
      <button class="func" onclick="insertFunc('ln(')">ln</button>
      <button class="func" onclick="insertFunc('sin(')" id="btnSin">sin</button>
      <button class="func" onclick="insertFunc('cos(')" id="btnCos">cos</button>
      <button class="func" onclick="insertFunc('tan(')" id="btnTan">tan</button>

      <!-- Row 3 -->
      <button class="func" onclick="insertFunc('√(')">√</button>
      <button class="func" onclick="insertFunc('STO')">STO</button>
      <button class="func" onclick="insertFunc('RCL')">RCL</button>
      <button class="func" onclick="insertFunc('Ans')">Ans</button>
      <button class="func" onclick="toggleDeg()">D/R</button>

      <!-- Row 4 -->
      <button class="func del" onclick="clearAll()">AC</button>
      <button class="func del" onclick="deleteChar()">DEL</button>
      <button class="func" onclick="insertFunc('%')">%</button>
      <button class="func" onclick="insertFunc('!')">x!</button>
      <button class="op" onclick="insertOp('/')">÷</button>

      <!-- Row 5 -->
      <button onclick="insertNum('7')">7</button>
      <button onclick="insertNum('8')">8</button>
      <button onclick="insertNum('9')">9</button>
      <button class="func" onclick="insertFunc('π')">π</button>
      <button class="op" onclick="insertOp('*')">×</button>

      <!-- Row 6 -->
      <button onclick="insertNum('4')">4</button>
      <button onclick="insertNum('5')">5</button>
      <button onclick="insertNum('6')">6</button>
      <button class="func" onclick="insertFunc('e')">e</button>
      <button class="op" onclick="insertOp('-')">-</button>

      <!-- Row 7 -->
      <button onclick="insertNum('1')">1</button>
      <button onclick="insertNum('2')">2</button>
      <button onclick="insertNum('3')">3</button>
      <button class="func" onclick="insertFunc('*10^')">×10ⁿ</button>
      <button class="op" onclick="insertOp('+')">+</button>

      <!-- Row 8 -->
      <button onclick="insertNum('0')">0</button>
      <button onclick="insertNum('.')">.</button>
      <button class="func" onclick="toggleSign()">±</button>
      <button class="op" style="grid-column: span 2;" onclick="evaluateDirect()">=</button>
    </div>
  </div>

  <script>
    let expr = "";
    let isShift = false;
    let isDeg = true;
    let lastAns = 0;
    let memoryVal = 0;

    function toggleTheme() {
      const html = document.documentElement;
      html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }

    function setColor(color) {
      document.documentElement.setAttribute('data-color', color);
    }

    function toggleShift() {
      isShift = !isShift;
      document.getElementById('shiftIndicator').innerText = isShift ? "SHIFT" : "DIRECT LOGIC";
      document.getElementById('btnSin').innerText = isShift ? "asin" : "sin";
      document.getElementById('btnCos').innerText = isShift ? "acos" : "cos";
      document.getElementById('btnTan').innerText = isShift ? "atan" : "tan";
    }

    function toggleDeg() {
      isDeg = !isDeg;
      document.getElementById('degRad').innerText = isDeg ? "DEG" : "RAD";
    }

    function updateDisplay() {
      document.getElementById('displayText').innerText = expr === "" ? "0" : expr;
    }

    function insertNum(num) {
      expr += num;
      updateDisplay();
    }

    function insertOp(op) {
      expr += op;
      updateDisplay();
    }

    function insertFunc(fn) {
      if (fn === 'sin(' && isShift) fn = 'asin(';
      if (fn === 'cos(' && isShift) fn = 'acos(';
      if (fn === 'tan(' && isShift) fn = 'atan(';

      if (fn === 'STO') { memoryVal = parseFloat(expr) || 0; return; }
      if (fn === 'RCL') { expr += memoryVal.toString(); updateDisplay(); return; }
      if (fn === 'Ans') { expr += lastAns.toString(); updateDisplay(); return; }

      expr += fn;
      if (isShift) toggleShift();
      updateDisplay();
    }

    function toggleSign() {
      if (expr.startsWith('-')) expr = expr.slice(1);
      else expr = '-' + expr;
      updateDisplay();
    }

    function clearAll() {
      expr = "";
      document.getElementById('exprText').innerText = "";
      updateDisplay();
    }

    function deleteChar() {
      expr = expr.slice(0, -1);
      updateDisplay();
    }

    function factorial(n) {
      if (n < 0) return NaN;
      if (n === 0 || n === 1) return 1;
      let res = 1; for (let i = 2; i <= n; i++) res *= i;
      return res;
    }

    function evaluateDirect() {
      if (!expr) return;
      document.getElementById('exprText').innerText = expr;

      try {
        let parseExpr = expr
          .replace(/π/g, Math.PI)
          .replace(/e/g, Math.E)
          .replace(/√\(/g, 'Math.sqrt(')
          .replace(/log\(/g, 'Math.log10(')
          .replace(/ln\(/g, 'Math.log(')
          .replace(/\^/g, '**');

        // Trigonometry handling for DEG/RAD
        if (isDeg) {
          parseExpr = parseExpr
            .replace(/sin\(([^)]+)\)/g, (m, p) => `Math.sin((${p}) * Math.PI / 180)`)
            .replace(/cos\(([^)]+)\)/g, (m, p) => `Math.cos((${p}) * Math.PI / 180)`)
            .replace(/tan\(([^)]+)\)/g, (m, p) => `Math.tan((${p}) * Math.PI / 180)`)
            .replace(/asin\(([^)]+)\)/g, (m, p) => `(Math.asin(${p}) * 180 / Math.PI)`)
            .replace(/acos\(([^)]+)\)/g, (m, p) => `(Math.acos(${p}) * 180 / Math.PI)`)
            .replace(/atan\(([^)]+)\)/g, (m, p) => `(Math.atan(${p}) * 180 / Math.PI)`);
        } else {
          parseExpr = parseExpr
            .replace(/sin\(/g, 'Math.sin(')
            .replace(/cos\(/g, 'Math.cos(')
            .replace(/tan\(/g, 'Math.tan(')
            .replace(/asin\(/g, 'Math.asin(')
            .replace(/acos\(/g, 'Math.acos(')
            .replace(/atan\(/g, 'Math.atan(');
        }

        // Factorial handling
        parseExpr = parseExpr.replace(/(\d+)!/g, (m, p) => factorial(parseInt(p)));

        let result = Function('"use strict"; return (' + parseExpr + ')')();
        lastAns = result;
        expr = result.toString();
        updateDisplay();
      } catch (err) {
        document.getElementById('displayText').innerText = "Error";
        expr = "";
      }
    }
  </script>
</body>
</html>
