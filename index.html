<!DOCTYPE html>
<html lang="en" data-theme="dark" data-color="blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fx-82AU PLUS II 2nd Edition (Organized Sections)</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: rgba(28, 28, 30, 0.88);
      --btn-num: #2c2c2e;
      --btn-sci: #1c1c1e;
      --btn-top: #3a3a3c;
      --btn-del: #ff3b30;
      --btn-ac: #34c759;
      --btn-shift: #ff9f0a;
      --btn-alpha: #ff2d55;
      --text: #ffffff;
      --border: rgba(255, 255, 255, 0.12);
      
      --color-red: #ff3b30;
      --color-orange: #ff9500;
      --color-yellow: #ffcc00;
      --color-green: #34c759;
      --color-blue: #007aff;
      --color-purple: #af52de;
      --color-pink: #ff2d55;
      --accent: var(--color-blue);
    }

    [data-theme="light"] {
      --bg: #f2f2f7;
      --card-bg: rgba(255, 255, 255, 0.88);
      --btn-num: #ffffff;
      --btn-sci: #e5e5ea;
      --btn-top: #d1d1d6;
      --text: #000000;
      --border: rgba(0, 0, 0, 0.12);
    }

    [data-color="red"] { --accent: var(--color-red); }
    [data-color="orange"] { --accent: var(--color-orange); }
    [data-color="yellow"] { --accent: var(--color-yellow); }
    [data-color="green"] { --accent: var(--color-green); }
    [data-color="blue"] { --accent: var(--color-blue); }
    [data-color="purple"] { --accent: var(--color-purple); }
    [data-color="pink"] { --accent: var(--color-pink); }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
    button.tool-btn { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); padding: 4px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; backdrop-filter: blur(10px); }
    
    .palette { display: flex; gap: 4px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }
    .dot.red { background: var(--color-red); }
    .dot.orange { background: var(--color-orange); }
    .dot.yellow { background: var(--color-yellow); }
    .dot.green { background: var(--color-green); }
    .dot.blue { background: var(--color-blue); }
    .dot.purple { background: var(--color-purple); }
    .dot.pink { background: var(--color-pink); }

    .calc-card { 
      background: var(--card-bg); 
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border); 
      border-radius: 32px; 
      padding: 18px; 
      width: 100%; 
      max-width: 370px; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .status-bar { display: flex; justify-content: space-between; font-size: 10px; opacity: 0.6; padding: 0 4px 6px 4px; font-weight: 600; letter-spacing: 0.5px; }
    
    .display { width: 100%; padding: 12px; text-align: right; margin-bottom: 14px; background: rgba(0,0,0,0.18); border-radius: 18px; border: 1px solid var(--border); }
    .expression { font-size: 12px; opacity: 0.5; min-height: 16px; word-break: break-all; }
    .current { font-size: 28px; font-weight: 300; letter-spacing: -0.5px; word-break: break-all; min-height: 36px; }

    /* Sectional Layout Styles */
    .section-title { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; opacity: 0.4; margin: 8px 0 4px 2px; }

    .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }

    button { 
      background: var(--btn-sci); 
      color: var(--text); 
      border: none; 
      height: 36px; 
      border-radius: 10px; 
      font-size: 12px; 
      font-weight: 500; 
      cursor: pointer;
      transition: opacity 0.12s ease, transform 0.08s ease;
    }
    button:active { opacity: 0.6; transform: scale(0.95); }
    
    .btn-shift { background: var(--btn-shift); color: #fff; font-weight: bold; font-size: 10px; }
    .btn-alpha { background: var(--btn-alpha); color: #fff; font-weight: bold; font-size: 10px; }
    .btn-top { background: var(--btn-top); font-size: 10px; }
    .btn-num { background: var(--btn-num); font-size: 15px; }
    .btn-del { background: var(--btn-del); color: #fff; font-weight: bold; }
    .btn-ac { background: var(--btn-ac); color: #fff; font-weight: bold; }
    .btn-op { background: var(--accent); color: #fff; font-size: 16px; }
  </style>
</head>
<body>

  <div class="toolbar">
    <button class="tool-btn" onclick="toggleTheme()">☀️ / 🌙</button>
    <div class="palette">
      <div class="dot red" onclick="setColor('red')"></div>
      <div class="dot orange" onclick="setColor('orange')"></div>
      <div class="dot yellow" onclick="setColor('yellow')"></div>
      <div class="dot green" onclick="setColor('green')"></div>
      <div class="dot blue" onclick="setColor('blue')"></div>
      <div class="dot purple" onclick="setColor('purple')"></div>
      <div class="dot pink" onclick="setColor('pink')"></div>
    </div>
  </div>

  <div class="calc-card">
    <div class="status-bar">
      <span id="shiftIndicator">DIRECT</span>
      <span>fx-82AU PLUS II</span>
      <span id="degRad">DEG</span>
    </div>

    <div class="display">
      <div class="expression" id="exprText"></div>
      <div class="current" id="displayText">0</div>
    </div>
    
    <!-- Section 1: System Control -->
    <div class="section-title">System & Modes</div>
    <div class="grid-4">
      <button class="btn-shift" onclick="toggleShift()" id="shiftBtn">SHIFT</button>
      <button class="btn-alpha" onclick="toggleAlpha()">ALPHA</button>
      <button class="btn-top" onclick="toggleDeg()">MODE</button>
      <button class="btn-top" onclick="clearAll()">ON</button>
    </div>

    <!-- Section 2: Scientific Functions -->
    <div class="section-title">Scientific Functions</div>
    <div class="grid-5">
      <!-- Row 1 -->
      <button onclick="insertFunc('Abs(')">Abs</button>
      <button onclick="insertFunc('^3')">x³</button>
      <button style="grid-column: span 2; opacity: 0.3;">D-PAD</button>
      <button onclick="insertFunc('^-1')">x⁻¹</button>

      <!-- Row 2 -->
      <button onclick="insertFunc('(')">a/b</button>
      <button onclick="insertFunc('√(')">√</button>
      <button onclick="insertFunc('^2')">x²</button>
      <button onclick="insertFunc('^')">xⁿ</button>
      <button onclick="insertFunc('log(')">log</button>

      <!-- Row 3 -->
      <button onclick="insertFunc('ln(')">ln</button>
      <button onclick="toggleSign()">(-)</button>
      <button onclick="insertFunc('°')">°' "</button>
      <button onclick="insertFunc('hyp')">hyp</button>
      <button onclick="insertFunc('sin(')" id="btnSin">sin</button>

      <!-- Row 4 -->
      <button onclick="insertFunc('cos(')" id="btnCos">cos</button>
      <button onclick="insertFunc('tan(')" id="btnTan">tan</button>
      <button onclick="insertFunc('RCL')">RCL</button>
      <button onclick="insertFunc('ENG')">ENG</button>
      <button onclick="insertFunc('(')">(</button>

      <!-- Row 5 -->
      <button onclick="insertFunc(')')">)</button>
      <button onclick="insertFunc('S⇔D')">S⇔D</button>
      <button onclick="insertFunc('M+')">M+</button>
      <button onclick="insertFunc('π')">π</button>
      <button onclick="insertFunc('e')">e</button>
    </div>

    <!-- Section 3: Editing & Numeric Keys -->
    <div class="section-title">Numpad & Basic Operations</div>
    <div class="grid-4">
      <button class="btn-del" onclick="deleteChar()">DEL</button>
      <button class="btn-ac" onclick="clearAll()">AC</button>
      <button class="btn-op" onclick="insertOp('*')">×</button>
      <button class="btn-op" onclick="insertOp('/')">÷</button>

      <button class="btn-num" onclick="insertNum('7')">7</button>
      <button class="btn-num" onclick="insertNum('8')">8</button>
      <button class="btn-num" onclick="insertNum('9')">9</button>
      <button class="btn-op" onclick="insertOp('+')">+</button>

      <button class="btn-num" onclick="insertNum('4')">4</button>
      <button class="btn-num" onclick="insertNum('5')">5</button>
      <button class="btn-num" onclick="insertNum('6')">6</button>
      <button class="btn-op" onclick="insertOp('-')">-</button>

      <button class="btn-num" onclick="insertNum('1')">1</button>
      <button class="btn-num" onclick="insertNum('2')">2</button>
      <button class="btn-num" onclick="insertNum('3')">3</button>
      <button class="btn-op" onclick="insertFunc('Ans')">Ans</button>

      <button class="btn-num" onclick="insertNum('0')">0</button>
      <button class="btn-num" onclick="insertNum('.')">.</button>
      <button class="btn-op" onclick="insertFunc('*10^')">×10ⁿ</button>
      <button class="btn-op" onclick="evaluateDirect()">=</button>
    </div>
  </div>

  <script>
    let expr = "";
    let isShift = false;
    let isDeg = true;
    let lastAns = 0;
    let memoryVal = 0;

    function toggleTheme() {
      const html = document.documentElement;
      html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }

    function setColor(color) {
      document.documentElement.setAttribute('data-color', color);
    }

    function toggleShift() {
      isShift = !isShift;
      document.getElementById('shiftIndicator').innerText = isShift ? "SHIFT" : "DIRECT";
      document.getElementById('btnSin').innerText = isShift ? "asin" : "sin";
      document.getElementById('btnCos').innerText = isShift ? "acos" : "cos";
      document.getElementById('btnTan').innerText = isShift ? "atan" : "tan";
    }

    function toggleAlpha() {}

    function toggleDeg() {
      isDeg = !isDeg;
      document.getElementById('degRad').innerText = isDeg ? "DEG" : "RAD";
    }

    function updateDisplay() {
      document.getElementById('displayText').innerText = expr === "" ? "0" : expr;
    }

    function insertNum(num) {
      expr += num;
      updateDisplay();
    }

    function insertOp(op) {
      expr += op;
      updateDisplay();
    }

    function insertFunc(fn) {
      if (fn === 'sin(' && isShift) fn = 'asin(';
      if (fn === 'cos(' && isShift) fn = 'acos(';
      if (fn === 'tan(' && isShift) fn = 'atan(';

      if (fn === 'RCL') { expr += memoryVal.toString(); updateDisplay(); return; }
      if (fn === 'M+') { memoryVal += parseFloat(expr) || 0; return; }
      if (fn === 'Ans') { expr += lastAns.toString(); updateDisplay(); return; }

      expr += fn;
      if (isShift) toggleShift();
      updateDisplay();
    }

    function toggleSign() {
      if (expr.startsWith('-')) expr = expr.slice(1);
      else expr = '-' + expr;
      updateDisplay();
    }

    function clearAll() {
      expr = "";
      document.getElementById('exprText').innerText = "";
      updateDisplay();
    }

    function deleteChar() {
      expr = expr.slice(0, -1);
      updateDisplay();
    }

    function evaluateDirect() {
      if (!expr) return;
      document.getElementById('exprText').innerText = expr;

      try {
        let parseExpr = expr
          .replace(/π/g, Math.PI)
          .replace(/e/g, Math.E)
          .replace(/Abs\(/g, 'Math.abs(')
          .replace(/√\(/g, 'Math.sqrt(')
          .replace(/log\(/g, 'Math.log10(')
          .replace(/ln\(/g, 'Math.log(')
          .replace(/\^/g, '**');

        if (isDeg) {
          parseExpr = parseExpr
            .replace(/sin\(([^)]+)\)/g, (m, p) => `Math.sin((${p}) * Math.PI / 180)`)
            .replace(/cos\(([^)]+)\)/g, (m, p) => `Math.cos((${p}) * Math.PI / 180)`)
            .replace(/tan\(([^)]+)\)/g, (m, p) => `Math.tan((${p}) * Math.PI / 180)`)
            .replace(/asin\(([^)]+)\)/g, (m, p) => `(Math.asin(${p}) * 180 / Math.PI)`)
            .replace(/acos\(([^)]+)\)/g, (m, p) => `(Math.acos(${p}) * 180 / Math.PI)`)
            .replace(/atan\(([^)]+)\)/g, (m, p) => `(Math.atan(${p}) * 180 / Math.PI)`);
        } else {
          parseExpr = parseExpr
            .replace(/sin\(/g, 'Math.sin(')
            .replace(/cos\(/g, 'Math.cos(')
            .replace(/tan\(/g, 'Math.tan(')
            .replace(/asin\(/g, 'Math.asin(')
            .replace(/acos\(/g, 'Math.acos(')
            .replace(/atan\(/g, 'Math.atan(');
        }

        let result = Function('"use strict"; return (' + parseExpr + ')')();
        lastAns = result;
        expr = result.toString();
        updateDisplay();
      } catch (err) {
        document.getElementById('displayText').innerText = "Error";
        expr = "";
      }
    }
  </script>
</body>
</html>
