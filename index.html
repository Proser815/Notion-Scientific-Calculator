<!DOCTYPE html>
<html lang="en" data-theme="dark" data-color="blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fx-82AU iOS Calculator</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: rgba(28, 28, 30, 0.85);
      --btn-num: #2c2c2e;
      --btn-func: #3a3a3c;
      --btn-shift: #ff9f0a;
      --text: #ffffff;
      --border: rgba(255, 255, 255, 0.12);
      
      --color-red: #ff3b30;
      --color-orange: #ff9500;
      --color-yellow: #ffcc00;
      --color-green: #34c759;
      --color-blue: #007aff;
      --color-purple: #af52de;
      --color-pink: #ff2d55;
      --accent: var(--color-blue);
    }

    [data-theme="light"] {
      --bg: #f2f2f7;
      --card-bg: rgba(255, 255, 255, 0.85);
      --btn-num: #ffffff;
      --btn-func: #e5e5ea;
      --text: #000000;
      --border: rgba(0, 0, 0, 0.12);
    }

    [data-color="red"] { --accent: var(--color-red); }
    [data-color="orange"] { --accent: var(--color-orange); }
    [data-color="yellow"] { --accent: var(--color-yellow); }
    [data-color="green"] { --accent: var(--color-green); }
    [data-color="blue"] { --accent: var(--color-blue); }
    [data-color="purple"] { --accent: var(--color-purple); }
    [data-color="pink"] { --accent: var(--color-pink); }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
    select, button.tool-btn { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); padding: 4px 8px; border-radius: 12px; font-size: 11px; cursor: pointer; backdrop-filter: blur(10px); }
    
    .palette { display: flex; gap: 4px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }
    .dot.red { background: var(--color-red); }
    .dot.orange { background: var(--color-orange); }
    .dot.yellow { background: var(--color-yellow); }
    .dot.green { background: var(--color-green); }
    .dot.blue { background: var(--color-blue); }
    .dot.purple { background: var(--color-purple); }
    .dot.pink { background: var(--color-pink); }

    .calc-card { 
      background: var(--card-bg); 
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border); 
      border-radius: 32px; 
      padding: 16px; 
      width: 100%; 
      max-width: 360px; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .status-bar { display: flex; justify-content: space-between; font-size: 10px; opacity: 0.6; padding: 0 4px 4px 4px; font-weight: 600; letter-spacing: 0.5px; }
    
    .display { width: 100%; padding: 8px 12px; text-align: right; margin-bottom: 8px; background: rgba(0,0,0,0.1); border-radius: 16px; border: 1px solid var(--border); }
    .history { font-size: 12px; opacity: 0.5; min-height: 16px; }
    .current { font-size: 32px; font-weight: 300; letter-spacing: -0.5px; word-break: break-all; }

    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }

    .grid button { 
      background: var(--btn-num); 
      color: var(--text); 
      border: none; 
      height: 42px; 
      border-radius: 12px; 
      font-size: 13px; 
      font-weight: 500; 
      cursor: pointer;
      transition: opacity 0.12s ease, transform 0.08s ease;
    }
    .grid button:active { opacity: 0.6; transform: scale(0.95); }
    
    .grid button.func { background: var(--btn-func); font-size: 11px; }
    .grid button.shift-btn { background: var(--btn-shift); color: #ffffff; font-weight: bold; }
    .grid button.op { background: var(--accent); color: #ffffff; font-size: 16px; font-weight: 600; }
    .grid button.del { background: var(--color-red); color: #ffffff; }
  </style>
</head>
<body>

  <div class="toolbar">
    <select id="langSelect" onchange="changeLang(this.value)">
      <option value="en">EN</option>
      <option value="es">ES</option>
      <option value="fr">FR</option>
    </select>
    <button class="tool-btn" onclick="toggleTheme()">☀️ / 🌙</button>
    <div class="palette">
      <div class="dot red" onclick="setColor('red')"></div>
      <div class="dot orange" onclick="setColor('orange')"></div>
      <div class="dot yellow" onclick="setColor('yellow')"></div>
      <div class="dot green" onclick="setColor('green')"></div>
      <div class="dot blue" onclick="setColor('blue')"></div>
      <div class="dot purple" onclick="setColor('purple')"></div>
      <div class="dot pink" onclick="setColor('pink')"></div>
    </div>
  </div>

  <div class="calc-card">
    <div class="status-bar">
      <span id="shiftIndicator">STANDARD</span>
      <span>fx-82AU PLUS II</span>
      <span id="degRad">DEG</span>
    </div>

    <div class="display">
      <div class="history" id="historyText"></div>
      <div class="current" id="displayText">0</div>
    </div>
    
    <div class="grid">
      <!-- Row 1: fx-82 special function row -->
      <button class="shift-btn" onclick="toggleShift()" id="shiftBtn">SHIFT</button>
      <button class="func" onclick="applyFx('frac')">a/b</button>
      <button class="func" onclick="applyFx('sqrt')">√</button>
      <button class="func" onclick="applyFx('sq')">x²</button>
      <button class="func" onclick="appendOp('^')">xⁿ</button>

      <!-- Row 2 -->
      <button class="func" onclick="applyFx('log')">log</button>
      <button class="func" onclick="applyFx('ln')">ln</button>
      <button class="func" onclick="applyFx('sin')" id="btnSin">sin</button>
      <button class="func" onclick="applyFx('cos')" id="btnCos">cos</button>
      <button class="func" onclick="applyFx('tan')" id="btnTan">tan</button>

      <!-- Row 3 -->
      <button class="func" onclick="applyFx('nCr')" id="btnNcr">nCr</button>
      <button class="func" onclick="applyFx('pol')">Pol</button>
      <button class="func" onclick="applyFx('sto')">STO</button>
      <button class="func" onclick="applyFx('rcl')">RCL</button>
      <button class="func" onclick="toggleDeg()">D/R</button>

      <!-- Row 4 -->
      <button class="func del" onclick="clearAll()">AC</button>
      <button class="func del" onclick="deleteDigit()">DEL</button>
      <button class="func" onclick="appendConst('(')">(</button>
      <button class="func" onclick="appendConst(')')">)</button>
      <button class="op" onclick="appendOp('÷')">÷</button>

      <!-- Row 5 -->
      <button onclick="appendNum('7')">7</button>
      <button onclick="appendNum('8')">8</button>
      <button onclick="appendNum('9')">9</button>
      <button class="func" onclick="applyFx('fact')">x!</button>
      <button class="op" onclick="appendOp('×')">×</button>

      <!-- Row 6 -->
      <button onclick="appendNum('4')">4</button>
      <button onclick="appendNum('5')">5</button>
      <button onclick="appendNum('6')">6</button>
      <button class="func" onclick="appendConst(Math.PI)">π</button>
      <button class="op" onclick="appendOp('-')">-</button>

      <!-- Row 7 -->
      <button onclick="appendNum('1')">1</button>
      <button onclick="appendNum('2')">2</button>
      <button onclick="appendNum('3')">3</button>
      <button class="func" onclick="appendConst(2.718281828)">e</button>
      <button class="op" onclick="appendOp('+')">+</button>

      <!-- Row 8 -->
      <button onclick="appendNum('0')">0</button>
      <button onclick="appendNum('.')">.</button>
      <button class="func" onclick="appendExp()">×10ⁿ</button>
      <button class="func" onclick="applyFx('ans')">Ans</button>
      <button class="op" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let currentInput = "0";
    let previousInput = "";
    let operator = null;
    let isShift = false;
    let isDeg = true;
    let lastAns = 0;
    let memoryVal = 0;

    function toggleTheme() {
      const html = document.documentElement;
      html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }

    function setColor(color) {
      document.documentElement.setAttribute('data-color', color);
    }

    function changeLang(lang) {}

    function toggleShift() {
      isShift = !isShift;
      document.getElementById('shiftIndicator').innerText = isShift ? "SHIFT" : "STANDARD";
      document.getElementById('btnSin').innerText = isShift ? "sin⁻¹" : "sin";
      document.getElementById('btnCos').innerText = isShift ? "cos⁻¹" : "cos";
      document.getElementById('btnTan').innerText = isShift ? "tan⁻¹" : "tan";
      document.getElementById('btnNcr').innerText = isShift ? "nPr" : "nCr";
    }

    function toggleDeg() {
      isDeg = !isDeg;
      document.getElementById('degRad').innerText = isDeg ? "DEG" : "RAD";
    }

    function updateDisplay() {
      document.getElementById('displayText').innerText = currentInput;
      document.getElementById('historyText').innerText = previousInput + (operator ? " " + operator : "");
    }

    function appendNum(num) {
      if (currentInput === "0" && num !== ".") currentInput = num;
      else if (num === "." && currentInput.includes(".")) return;
      else currentInput += num;
      updateDisplay();
    }

    function appendConst(val) {
      currentInput = val.toString();
      updateDisplay();
    }

    function appendExp() {
      if (!currentInput.includes("e")) {
        currentInput += "e+";
        updateDisplay();
      }
    }

    function appendOp(op) {
      if (operator && currentInput !== "") calculate();
      previousInput = currentInput;
      operator = op;
      currentInput = "";
      updateDisplay();
    }

    function applyFx(type) {
      let val = parseFloat(currentInput);

      if (type === 'sin') {
        let rad = isDeg ? val * (Math.PI / 180) : val;
        currentInput = isShift ? (Math.asin(val) * (isDeg ? 180/Math.PI : 1)).toString() : Math.sin(rad).toString();
      } else if (type === 'cos') {
        let rad = isDeg ? val * (Math.PI / 180) : val;
        currentInput = isShift ? (Math.acos(val) * (isDeg ? 180/Math.PI : 1)).toString() : Math.cos(rad).toString();
      } else if (type === 'tan') {
        let rad = isDeg ? val * (Math.PI / 180) : val;
        currentInput = isShift ? (Math.atan(val) * (isDeg ? 180/Math.PI : 1)).toString() : Math.tan(rad).toString();
      } else if (type === 'sqrt') {
        currentInput = Math.sqrt(val).toString();
      } else if (type === 'sq') {
        currentInput = Math.pow(val, 2).toString();
      } else if (type === 'log') {
        currentInput = Math.log10(val).toString();
      } else if (type === 'ln') {
        currentInput = Math.log(val).toString();
      } else if (type === 'fact') {
        let f = 1; for(let i=1; i<=val; i++) f*=i; currentInput = f.toString();
      } else if (type === 'ans') {
        currentInput = lastAns.toString();
      } else if (type === 'sto') {
        memoryVal = val;
      } else if (type === 'rcl') {
        currentInput = memoryVal.toString();
      } else if (type === 'frac') {
        currentInput = (val / 100).toString(); // Quick percentage/fraction approximation
      }

      if (isShift) toggleShift();
      updateDisplay();
    }

    function calculate() {
      if (!operator || currentInput === "") return;
      let prev = parseFloat(previousInput);
      let curr = parseFloat(currentInput);
      let result = 0;

      switch(operator) {
        case '+': result = prev + curr; break;
        case '-': result = prev - curr; break;
        case '×': result = prev * curr; break;
        case '÷': result = curr !== 0 ? prev / curr : "Error"; break;
        case '^': result = Math.pow(prev, curr); break;
      }

      lastAns = result;
      currentInput = result.toString();
      previousInput = "";
      operator = null;
      updateDisplay();
    }

    function clearAll() {
      currentInput = "0";
      previousInput = "";
      operator = null;
      updateDisplay();
    }

    function deleteDigit() {
      currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : "0";
      updateDisplay();
    }

    updateDisplay();
  </script>
</body>
</html>
